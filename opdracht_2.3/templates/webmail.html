<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webmail</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 15px;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 { margin: 0 0 4px; font-size: 24px; }
        .sender { margin: 0 0 24px; color: var(--muted); }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        .hint { font-weight: 400; color: var(--muted); }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            color: inherit;
        }
        input[type="text"]:focus, textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: -1px;
        }
        textarea { resize: vertical; }
        .row { display: flex; flex-wrap: wrap; gap: 16px; }
        .row > div { flex: 1 1 240px; }
        .checkbox { display: flex; align-items: center; gap: 8px; font-weight: 400; }
        button {
            margin-top: 24px;
            padding: 11px 28px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--accent-hover); }
        .flash { margin: 0 0 12px; padding: 12px 14px; border-radius: 8px; }
        .flash.success { background: #dcfce7; color: #166534; }
        .flash.error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<main>
    <h1>Webmail</h1>
    <p class="sender">Afzender: {{ sender or "niet ingesteld" }}</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}

    <form action="{{ url_for('send') }}" method="post" enctype="multipart/form-data">
        <label for="to">Aan <span class="hint">(meerdere adressen scheiden met een komma)</span></label>
        <input type="text" id="to" name="to" value="{{ form.get('to', '') }}" required>

        <div class="row">
            <div>
                <label for="cc">CC</label>
                <input type="text" id="cc" name="cc" value="{{ form.get('cc', '') }}">
            </div>
            <div>
                <label for="bcc">BCC</label>
                <input type="text" id="bcc" name="bcc" value="{{ form.get('bcc', '') }}">
            </div>
        </div>

        <label for="subject">Onderwerp</label>
        <input type="text" id="subject" name="subject" value="{{ form.get('subject', '') }}" required>

        <label for="body">Bericht</label>
        <textarea id="body" name="body" rows="10">{{ form.get('body', '') }}</textarea>

        <label for="attachments">Bijlagen <span class="hint">(max. 20 MB samen)</span></label>
        <input type="file" id="attachments" name="attachments" multiple>

        <label for="signature">Handtekening</label>
        <textarea id="signature" name="signature" rows="3">{{ signature }}</textarea>
        <label class="checkbox">
            <input type="checkbox" name="use_signature" {% if not form or form.get('use_signature') %}checked{% endif %}>
            Handtekening meesturen
        </label>

        <button type="submit">Verzenden</button>
    </form>
</main>
</body>
</html>
